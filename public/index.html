<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin MJSCONAMIX</title><script src="/socket.io/socket.io.js"></script>
<style>*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;padding:16px;max-width:700px;margin:auto}
button{padding:8px 12px;border-radius:8px;border:none;background:#ff2a6d;color:#fff;font-weight:700}
.tabs{display:flex;gap:8px;margin:12px 0}.tab{flex:1;padding:12px;background:#111;border:1px solid #222;color:#888;border-radius:10px;font-weight:800}
.tab.active{background:#ff2a6d;color:#fff}
.card{background:#1a1a1a;border:1px solid #222;border-radius:12px;padding:12px;margin:10px 0;display:flex;gap:12px;justify-content:space-between}
</style></head><body>
<h2 style="color:#ff2a6d">ADMIN 🔒</h2>
<div id="login"><input id="pass" type="password" placeholder="Clave DVS1404" style="padding:12px;border-radius:10px;background:#111;border:1px solid #333;color:#fff;width:70%"><button onclick="login()" style="margin-left:6px">Entrar</button><p id="st" style="opacity:.5"></p></div>
<div id="panel" style="display:none">
<div class="tabs"><button class="tab active" id="b1" onclick="show('text')">💬 Chismes</button><button class="tab" id="b2" onclick="show('photo')">📷 Fotos</button></div>
<div id="secText"></div><div id="secPhoto" style="display:none"></div>
</div>
<script>
const socket=io();
let myPass="", allData={textMsgs:[],photoMsgs:[]};
socket.on('connect',()=>document.getElementById('st').innerText='Conectado ✓');
socket.on('admin-updated',(d)=>{ allData=d; render(); });
function show(m){
  document.getElementById('secText').style.display=m==='text'?'block':'none';
  document.getElementById('secPhoto').style.display=m==='photo'?'block':'none';
  document.getElementById('b1').className=m==='text'?'tab active':'tab';
  document.getElementById('b2').className=m==='photo'?'tab active':'tab';
}
function login(){
  myPass=document.getElementById('pass').value.trim();
  socket.emit('admin-login',myPass,ok=>{
    if(!ok) return alert('Clave mal');
    document.getElementById('login').style.display='none';
    document.getElementById('panel').style.display='block';
    load();
  });
}
function load(){
  socket.emit('admin-get-all',myPass,d=>{
    if(!d){ alert('Error cargando'); return; }
    allData=d; render();
  });
}
function render(){
  const t=document.getElementById('secText'); const p=document.getElementById('secPhoto');
  t.innerHTML=''; p.innerHTML='';
  if(allData.textMsgs.length==0) t.innerHTML='<p style="opacity:.4">No hay chismes</p>';
  else allData.textMsgs.slice().reverse().forEach(m=>{
    let img = m.image? `<img src="${m.image}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;margin-bottom:6px;display:block">` : '';
    let replies = (m.replies||[]).map(r=>`<div style="font-size:12px;display:flex;justify-content:space-between;gap:6px">${r.text} <button onclick="delReply('text','${m.id}','${r.id}')" style="background:#333">x</button></div>`).join('');
    t.innerHTML+=`<div class="card"><div>${img}<b>${(m.text||'').replace(/</g,'&lt;')}</b><div style="margin-top:6px">${replies}</div></div><button onclick="del('text','${m.id}')">Borrar</button></div>`;
  });
  if(allData.photoMsgs.length==0) p.innerHTML='<p style="opacity:.4">No hay fotos</p>';
  else allData.photoMsgs.slice().reverse().forEach(m=>{
    let replies = (m.replies||[]).map(r=>`<div style="font-size:12px;display:flex;justify-content:space-between;gap:6px">${r.text} <button onclick="delReply('photo','${m.id}','${r.id}')" style="background:#333">x</button></div>`).join('');
    p.innerHTML+=`<div class="card"><div><img src="${m.image}" style="width:90px;height:90px;object-fit:cover;border-radius:8px"><div style="margin-top:6px"><b>${(m.text||'').replace(/</g,'&lt;')}</b></div><div>${replies}</div></div><button onclick="del('photo','${m.id}')">Borrar</button></div>`;
  });
}
function del(type,id){ if(!confirm('¿Borrar?')) return; socket.emit('admin-delete',myPass,type,id); setTimeout(load,500); }
function delReply(type,pid,rid){ socket.emit('admin-delete-reply',myPass,type,pid,rid); setTimeout(load,300); }
</script></body></html>
