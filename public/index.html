<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUZÓN MJSCONAMIX</title><script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;margin:0;padding:16px;max-width:600px;margin:auto}
h1{color:#ff2a6d;text-align:center}
.tabs{display:flex;gap:8px;background:#111;border-radius:14px;padding:6px}
.tab{flex:1;padding:12px;border-radius:10px;border:none;background:transparent;color:#888;font-weight:800}
.tab.active{background:#ff2a6d;color:#fff}
.box{background:#111;border:1px solid #222;border-radius:16px;padding:12px;margin:14px 0}
textarea{width:100%;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:12px;padding:12px;font-size:14px}
button.send{background:#ff2a6d;border:none;color:#fff;padding:13px;border-radius:12px;font-weight:800;width:100%;margin-top:8px;font-size:15px}
.msg{background:#1a1a1a;border:1px solid #222;border-radius:14px;padding:12px;margin:12px 0}
/* ARREGLO FOTOS */
.photo{background:#1a1a1a;border:1px solid #222;border-radius:16px;margin:14px 0;overflow:hidden}
.photo img{width:100%;height:auto;max-height:650px;object-fit:contain;background:#000;display:block}
.photo .caption{padding:12px;font-size:15px;line-height:1.4}
.replyBox{background:#0a0a0a;border-radius:10px;padding:8px;margin:10px 12px;border:1px solid #222;display:flex;gap:6px}
.reply{font-size:13px;opacity:.9;margin:6px 12px;border-left:2px solid #ff2a6d;padding-left:8px}
.preview{width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin-top:10px;display:none;background:#000}
</style></head><body>
<h1>📮 MJSCONAMIX</h1>
<div class="tabs"><button class="tab active" id="t1" onclick="showTab('text')">💬 Chismes</button><button class="tab" id="t2" onclick="showTab('photo')">📷 Fotos</button></div>

<div id="panelText">
<div class="box"><textarea id="txt" rows="3" placeholder="Chisme anónimo..."></textarea>
<input type="file" id="imgInputText" accept="image/*" style="display:none">
<div style="display:flex;gap:8px;margin-top:8px"><button onclick="document.getElementById('imgInputText').click()" style="background:#222;border:none;color:#fff;padding:11px;border-radius:10px;flex:1">📷 Foto opcional</button><button class="send" onclick="sendText()" style="margin-top:0;flex:2">Enviar</button></div>
<img id="previewText" class="preview"></
