<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MJSCONAMIX</title><script src="/socket.io/socket.io.js"></script><style>
body{background:#0a0a0a;color:#fff;font-family:system-ui;max-width:600px;margin:auto;padding:12px}
h1{color:#ff2a6d;text-align:center}
.tabs{display:flex;gap:8px;background:#111;padding:6px;border-radius:12px}
.tab{flex:1;padding:12px;border:none;border-radius:10px;background:#222;color:#888;font-weight:800}
.tab.active{background:#ff2a6d;color:#fff}
.box{background:#111;border:1px solid #222;border-radius:12px;padding:12px;margin:12px 0}
textarea{width:100%;background:#000;color:#fff;border:1px solid #333;border-radius:10px;padding:10px}
button.action{width:100%;padding:12px;border-radius:10px;border:none;font-weight:800;margin-top:8px}
.btn-gray{background:#222;color:#fff;border:1px solid #333}
.btn-pink{background:#ff2a6d;color:#fff}
.card{background:#161616;border:1px solid #2a2a2a;border-radius:18px;overflow:hidden;margin:14px 0}
.card img{width:100%;display:block;height:auto;min-height:200px;background:#000;object-fit:contain;-webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;pointer-events:none}
.card.content{padding:14px}
.txt{font-size:16px;font-weight:600;white-space:pre-wrap;word-break:break-word}
.reply{font-size:13px;color:#ccc;border-left:3px solid #ff2a6d;padding-left:8px;margin:6px 0}
.replyBox{display:flex;gap:6px;margin-top:10px}
.replyBox input{flex:1;background:#000;border:1px solid #333;color:#fff;padding:9px;border-radius:8px}
.prev{width:100%;display:none;border-radius:12px;margin-top:8px;max-height:350px;object-fit:contain;background:#000}
.img-wrap{position:relative;width:100%;background:#000}
.img-wrap::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;z-index:2}
</style></head><body>
<h1>📮 MJSCONAMIX</h1>
<div class="tabs"><button id="b1" class="tab active" onclick="showTab('text')">💬 Chismes</button><button id="b2" class="tab" onclick="showTab('photo')">📷 Fotos</button></div>

<div id="panelText"><div class="box"><textarea id="inText" rows="3" placeholder="Escribe tu chisme..."></textarea><input type="file" id="fileText" accept="image/*" style="display:none"><button class="action btn-gray" type="button" onclick="document.getElementById('fileText').click()">📷 Foto opcional</button><img id="prevText" class="prev"><button class="action btn-pink" type="button" onclick="sendText()">Enviar chisme</button></div><div id="feedText">Cargando...</div><button id="btnMoreText" class="action btn-gray" style="display:none" onclick="loadMore('text')">Ver más chismes</button></div>

<div id="panelPhoto" style="display:none"><div class="box"><textarea id="inPhotoText" rows="2" placeholder="Describe la foto..."></textarea><input type="file" id="filePhoto" accept="image/*" style="display:none"><button class="action btn-gray" type="button" onclick="document.getElementById('filePhoto').click()">📷 Seleccionar foto</button><img id="prevPhoto" class="prev"><button class="action btn-pink" type="button" onclick="sendPhoto()">Publicar foto</button></div><div id="feedPhoto">Cargando...</div><button id="btnMorePhoto" class="action btn-gray" style="display:none" onclick="loadMore('photo')">Ver más fotos</button></div>

<script>
document.addEventListener('contextmenu', e=> e.preventDefault());
document.addEventListener('dragstart', e=> e.preventDefault());
document.addEventListener('selectstart', e=> e.preventDefault());

const socket = io();
let imgText = null, imgPhoto = null;
let offsetText = 20, offsetPhoto = 20;

function showTab(m){panelText.style.display=m==='text'?'block':'none';panelPhoto.style.display=m==='photo'?'block':'none';b1.className=m==='text'?'tab active':'tab';b2.className=m==='photo'?'tab active':'tab';}

function compress(file, cb){
 const reader = new FileReader();
 reader.onload = e=>{
  const img = new Image();
  img.onload = ()=>{
   const canvas = document.createElement('canvas');
   let w=img.width,h=img.height;
   const MAX=800;
   if(w>MAX||h>MAX){if(w>h){h=h*MAX/w;w=MAX;}else{w=w*MAX/h;h=MAX;}}
   canvas.width=w;canvas.height=h;
   const ctx = canvas.getContext('2d');
   ctx.drawImage(img,0,0,w,h);
   ctx.font = `bold ${Math.floor(w*0.05)}px Arial`;
   ctx.fillStyle = "rgba(255,255,255,0.7)";
   ctx.strokeStyle = "rgba(0,0,0,0.7)";
   ctx.lineWidth = 3;
   const text = "MJSCONAMIX";
   const textW = ctx.measureText(text).width;
   ctx.strokeText(text, w - textW - 15, h - 15);
   ctx.fillText(text, w - textW - 15, h - 15);
   cb(canvas.toDataURL('image/jpeg',0.65));
  };
  img.src=e.target.result;
 };
 reader.readAsDataURL(file);
}

fileText.addEventListener('change', e=>{const f=e.target.files[0];if(!f)return;compress(f,r=>{imgText=r;prevText.src=r;prevText.style.display='block';});});
filePhoto.addEventListener('change', e=>{const f=e.target.files[0];if(!f)return;compress(f,r=>{imgPhoto=r;prevPhoto.src=r;prevPhoto.style.display='block';});});

function cardHTML(m,type){
 const replies=(m.replies||[]).map(r=>`<div class="reply">${r.text.replace(/</g,'&lt;')}</div>`).join('');
 return `<div class="card" id="${type}-${m.id}">${m.image?`<div class="img-wrap"><img src="${m.image}" draggable="false" oncontextmenu="return false"></div>`:''}<div class="content"><div class="txt">${(m.text||'').replace(/</g,'&lt;')}</div><div id="${type}-${m.id}-replies">${replies}</div><div class="replyBox"><input id="${type}-${m.id}-inp" placeholder="Responder..."><button type="button" onclick="reply('${type}','${m.id}')" style="background:#222;color:#fff;border:none;padding:9px 12px;border-radius:8px">↩️</button></div></div></div>`;
}

socket.on('init',d=>{
 feedText.innerHTML=d.textMsgs.slice().reverse().map(m=>cardHTML(m,'text')).join('')||'<p style="opacity:.4;text-align:center">No hay chismes</p>';
 feedPhoto.innerHTML=d.photoMsgs.slice().reverse().map(m=>cardHTML(m,'photo')).join('')||'<p style="opacity:.4;text-align:center">No hay fotos</p>';
 if(d.totalText > 20) btnMoreText.style.display='block';
 if(d.totalPhoto > 20) btnMorePhoto.style.display='block';
});
socket.on('new-text',m=>feedText.insertAdjacentHTML('afterbegin',cardHTML(m,'text')));
socket.on('new-photo',m=>feedPhoto.insertAdjacentHTML('afterbegin',cardHTML(m,'photo')));
socket.on('update-replies',({type,parentId,replies})=>{
 const el=document.getElementById(type+'-'+parentId+'-replies');if(el) el.innerHTML=replies.map(r=>`<div class="reply">${r.text.replace(/</g,'&lt;')}</div>`).join('');
});
socket.on('reload',()=>location.reload());

function loadMore(type){
 if(type==='text'){ socket.emit('load-more',{type, offset:offsetText}); offsetText+=20; }
 else { socket.emit('load-more',{type, offset:offsetPhoto}); offsetPhoto+=20; }
}
socket.on('more-texts', arr=>{ arr.reverse().forEach(m=>feedText.insertAdjacentHTML('beforeend',cardHTML(m,'text'))); if(arr.length<20) btnMoreText.style.display='none'; });
socket.on('more-photos', arr=>{ arr.reverse().forEach(m=>feedPhoto.insertAdjacentHTML('beforeend',cardHTML(m,'photo'))); if(arr.length<20) btnMorePhoto.style.display='none'; });

function reply(type,id){const inp=document.getElementById(type+'-'+id+'-inp');if(!inp.value.trim())return;socket.emit('reply',{type,parentId:id,text:inp.value});inp.value='';}
function sendText(){const t=inText.value;if(!t.trim()&&!imgText){alert('Escribe algo');return;}socket.emit('send-text',{text:t,image:imgText});inText.value='';imgText=null;prevText.style.display='none';}
function sendPhoto(){if(!imgPhoto){alert('Selecciona foto');return;}socket.emit('send-photo',{text:inPhotoText.value,image:imgPhoto});inPhotoText.value='';imgPhoto=null;prevPhoto.style.display='none';}
</script></body></html>
