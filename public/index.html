<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUZÓN MJSCONAMIX</title><script src="/socket.io/socket.io.js"></script><style>*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;margin:0;padding:16px;max-width:600px;margin:auto}h1{color:#ff2a6d;text-align:center}.tabs{display:flex;gap:8px;background:#111;border-radius:14px;padding:6px}.tab{flex:1;padding:12px;border-radius:10px;border:none;background:transparent;color:#888;font-weight:800}.tab.active{background:#ff2a6d;color:#fff}.box{background:#111;border:1px solid #222;border-radius:16px;padding:12px;margin:14px 0}textarea{width:100%;background:#0a0a0a;border:1px solid #333;color:#fff;border-radius:12px;padding:10px}button.send{background:#ff2a6d;border:none;color:#fff;padding:12px;border-radius:12px;font-weight:800;width:100%;margin-top:8px}.msg{background:#1a1a1a;border:1px solid #222;border-radius:14px;padding:12px;margin:12px 0}.photo{border-radius:16px;overflow:hidden;background:#1a1a1a;border:1px solid #222;margin:12px 0}.photo img{width:100%;display:block}.replyBox{background:#0a0a0a;border-radius:10px;padding:8px;margin-top:8px;border:1px solid #222;display:flex;gap:6px}.reply{font-size:13px;opacity:.9;margin:6px 0;border-left:2px solid #ff2a6d;padding-left:8px}.preview{max-width:120px;border-radius:10px;margin-top:8px;display:none}</style></head><body><h1>📮 MJSCONAMIX</h1><div class="tabs"><button class="tab active" id="t1" onclick="showTab('text')">💬 Chismes</button><button class="tab" id="t2" onclick="showTab('photo')">📷 Fotos</button></div><div id="panelText"><div class="box"><textarea id="txt" rows="3" placeholder="Chisme anónimo..."></textarea><input type="file" id="imgInputText" accept="image/*" style="display:none"><div style="display:flex;gap:8px;margin-top:8px"><button onclick="document.getElementById('imgInputText').click()" style="background:#222;border:none;color:#fff;padding:10px;border-radius:10px;flex:1">📷 Foto opcional</button><button class="send" onclick="sendText()" style="margin-top:0;flex:2">Enviar</button></div><img id="previewText" class="preview"></div><div id="feedText">Cargando...</div></div><div id="panelPhoto" style="display:none"><div class="box"><textarea id="cap" rows="2" placeholder="Ej: los caché abrazados"></textarea><input type="file" id="imgInput" accept="image/*" style="display:none"><button onclick="document.getElementById('imgInput').click()" style="background:#222;border:none;color:#fff;padding:10px;border-radius:10px;width:100%;margin-top:8px">📷 Seleccionar foto</button><img id="preview" class="preview"><button class="send" onclick="sendPhoto()">Publicar foto</button></div><div id="feedPhoto">Cargando...</div></div><script>
const socket=io();let selected=null,selectedText=null;
function showTab(m){document.getElementById('panelText').style.display=m==='text'?'block':'none';document.getElementById('panelPhoto').style.display=m==='photo'?'block':'none';document.getElementById('t1').className=m==='text'?'tab active':'tab';document.getElementById('t2').className=m==='photo'?'tab active':'tab';}
function textHTML(m){return `<div class="msg" id="text-${m.id}"><div>${(m.text||'').replace(/</g,'&lt;')}</div><div id="text-${m.id}-replies">${(m.replies||[]).map(r=>`<div class="reply">${r.text.replace(/</g,'&lt;')}</div>`).join('')}</div><div class="replyBox"><input id="text-${m.id}-input" placeholder="Responder..." style="flex:1;background:#111;border:1px solid #333;color:#fff;padding:8px;border-radius:8px"><button onclick="reply('text','${m.id}')" style="background:#222;color:#fff;border:none;padding:8px;border-radius:8px">↩️</button></div></div>`;}
function photoHTML(m){return `<div class="photo" id="photo-${m.id}"><img src="${m.image}" loading="lazy"><div style="padding:10px">${(m.text||'').replace(/</g,'&lt;')}<div id="photo-${m.id}-replies">${(m.replies||[]).map(r=>`<div class="reply">${r.text.replace(/</g,'&lt;')}</div>`).join('')}</div><div class="replyBox"><input id="photo-${m.id}-input" placeholder="Comentar..." style="flex:1;background:#0a0a0a;border:1px solid #333;color:#fff;padding:8px;border-radius:8px"><button onclick="reply('photo','${m.id}')" style="background:#222;color:#fff;border:none;padding:8px;border-radius:8px">↩️</button></div></div></div>`;}
socket.on('init-feed',d=>{const ft=document.getElementById('feedText'),fp=document.getElementById('feedPhoto');ft.innerHTML='';fp.innerHTML='';if(d.texts.length==0) ft.innerHTML='<p style="opacity:.4;text-align:center">Sé el primero</p>'; else d.texts.slice().reverse().forEach(m=>ft.insertAdjacentHTML('beforeend',textHTML(m)));if(d.photos.length==0) fp.innerHTML='<p style="opacity:.4;text-align:center">Sin fotos aún</p>'; else d.photos.slice().reverse().forEach(m=>fp.insertAdjacentHTML('beforeend',photoHTML(m)));});
socket.on('new-text',m=>document.getElementById('feedText').insertAdjacentHTML('afterbegin',textHTML(m)));
socket.on('new-photo',m=>document.getElementById('feedPhoto').insertAdjacentHTML('afterbegin',photoHTML(m)));
socket.on('update-replies',({type,parentId,replies})=>{const el=document.getElementById(type+'-'+parentId+'-replies');if(el) el.innerHTML=replies.map(r=>`<div class="reply">${r.text.replace(/</g,'&lt;')}</div>`).join('');});
socket.on('force-reload',()=>location.reload());
function reply(type,id){const inp=document.getElementById(type+'-'+id+'-input');if(!inp.value.trim()) return; socket.emit('reply',{type,parentId:id,text:inp.value}); inp.value='';}
document.getElementById('imgInputText').addEventListener('change',e=>{const f=e.target.files[0];if(!f) return; const r=new FileReader();r.onload=()=>{selectedText=r.result; document.getElementById('previewText').src=selectedText; document.getElementById('previewText').style.display='block';}; r.readAsDataURL(f);});
function sendText(){const t=document.getElementById('txt').value;if(!t.trim()&&!selectedText) return; if(selectedText) socket.emit('send-photo',{text:t,image:selectedText}); else socket.emit('send-text',t); document.getElementById('txt').value=''; selectedText=null; document.getElementById('previewText').style.display='none';}
document.getElementById('imgInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f) return; const r=new FileReader();r.onload=()=>{selected=r.result; document.getElementById('preview').src=selected; document.getElementById('preview').style.display='block';}; r.readAsDataURL(f);});
function sendPhoto(){if(!selected){alert('Selecciona foto');return;} const c=document.getElementById('cap').value; socket.emit('send-photo',{text:c,image:selected}); document.getElementById('cap').value=''; selected=null; document.getElementById('preview').style.display='none';}
</script></body></html>
