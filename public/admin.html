<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>*{box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;padding:16px;max-width:700px;margin:auto}button{padding:10px;border-radius:10px;border:none;background:#ff2a6d;color:#fff;font-weight:800}.tabs{display:flex;gap:8px;margin:12px 0}.tab{flex:1;padding:12px;background:#111;border:1px solid #222;color:#888;border-radius:10px}.tab.active{background:#ff2a6d;color:#fff}.card{background:#1a1a1a;border:1px solid #222;border-radius:12px;padding:12px;margin:10px 0;display:flex;gap:10px;justify-content:space-between}input[type=password]{-webkit-text-security:disc}</style></head><body><h2 style="color:#ff2a6d">ADMIN 🔒</h2><div id="login"><input id="pass" type="password" placeholder="••••••••" style="padding:12px;border-radius:10px;background:#111;border:1px solid #333;color:#fff;width:65%"><button onclick="login()" style="margin-left:6px">Entrar</button><p id="msg" style="color:#888"></p></div><div id="panel" style="display:none"><div class="tabs"><button class="tab active" id="b1" onclick="show('text')">💬 Chismes</button><button class="tab" id="b2" onclick="show('photo')">📷 Fotos</button></div><div id="secText"></div><div id="secPhoto" style="display:none"></div></div><script>
let PASS="",DATA={textMsgs:[],photoMsgs:[]};function show(m){document.getElementById('secText').style.display=m==='text'?'block':'none';document.getElementById('secPhoto').style.display=m==='photo'?'block':'none';document.getElementById('b1').className=m==='text'?'tab active':'tab';document.getElementById('b2').className=m==='photo'?'tab active':'tab';}
async function login(){PASS=document.getElementById('pass').value.trim();document.getElementById('msg').innerText='Verificando...';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS})});const j=await r.json();if(!j.ok) return document.getElementById('msg').innerText='Clave mal ❌';document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';load();}
async function load(){const r=await fetch('/api/admin/all?pass='+encodeURIComponent(PASS));DATA=await r.json();render();}
function render(){const t=document.getElementById('secText'),p=document.getElementById('secPhoto');t.innerHTML='';p.innerHTML='';if(DATA.textMsgs.length==0) t.innerHTML='<p style="opacity:.4">Sin chismes</p>'; DATA.textMsgs.slice().reverse().forEach(m=>{let replies=(m.replies||[]).map(rr=>`<div style="font-size:12px;display:flex;justify-content:space-between">${rr.text} <button onclick="delReply('text','${m.id}','${rr.id}')" style="background:#333">x</button></div>`).join(''); t.innerHTML+=`<div class="card"><div><b>${(m.text||'').replace(/</g,'&lt;')}</b><div>${replies}</div></div><button onclick="del('text','${m.id}')">Borrar</button></div>`;}); if(DATA.photoMsgs.length==0) p.innerHTML='<p style="opacity:.4">Sin fotos</p>'; DATA.photoMsgs.slice().reverse().forEach(m=>{let replies=(m.replies||[]).map(rr=>`<div style="font-size:12px;display:flex;justify-content:space-between">${rr.text} <button onclick="delReply('photo','${m.id}','${rr.id}')" style="background:#333">x</button></div>`).join(''); p.innerHTML+=`<div class="card"><div><img src="${m.image}" style="width:80px;height:80px;object-fit:cover;border-radius:8px"><div><b>${(m.text||'').replace(/</g,'&lt;')}</b></div><div>${replies}</div></div><button onclick="del('photo','${m.id}')">Borrar</button></div>`;});}
async function del(type,id){if(!confirm('¿Borrar?')) return; await fetch('/api/admin/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,type,id})}); load();}
async function delReply(type,parentId,replyId){await fetch('/api/admin/delete-reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:PASS,type,parentId,replyId})}); load();}
</script></body></html>
